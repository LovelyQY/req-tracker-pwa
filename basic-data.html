<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>基础数据</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="theme.css?v=1.4.33">
<style>
:root{
  --primary:#1677ff; --primary-light:#4096ff; --bg:#f5f7fa; --surface:#fff;
  --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,[onclick]{outline:none}
button:focus:not(:focus-visible),a:focus:not(:focus-visible),[onclick]:focus:not(:focus-visible),input:focus:not(:focus-visible),select:focus:not(:focus-visible),textarea:focus:not(:focus-visible){outline:none}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;padding:0;-webkit-font-smoothing:antialiased;
}
.nav-bar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;height:52px;padding:0 8px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding-top:calc(env(safe-area-inset-top) + 8px)}
.nav-back{width:40px;height:40px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.nav-back svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;text-align:center;position:absolute;left:0;right:0;pointer-events:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 40px)}
.section-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:4px 4px 14px}
.module-list{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.module-row{
  display:flex;align-items:center;gap:14px;padding:16px;
  background:var(--surface);border-bottom:1px solid var(--border);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  transition:background .12s}
.module-row:last-child{border-bottom:none}
.module-row:active{background:#f2f4f7}
.module-icon{
  flex-shrink:0;width:44px;height:44px;border-radius:var(--icon-radius);
  display:flex;align-items:center;justify-content:center;color:var(--icon-fg);
  background:var(--icon-bg);box-shadow:var(--icon-shadow)}
.module-main{flex:1;min-width:0}
.module-name{font-size:16px;font-weight:600;word-break:break-all}
.module-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.module-arrow{color:#c7ccd4;flex-shrink:0}
</style>
<script src="auth.js?v=1.4.33" defer></script>
<script src="permissions-registry.js?v=1.4.33" defer></script>
<script src="permissions.js?v=1.4.33" defer></script>
<script src="config.js?v=1.4.33"></script>
<script src="sw-register.js?v=1.4.33"></script>
<script src="page-icons.js?v=1.4.33"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
  // 登录闸门：无效会话跳转登录页
  (function () {
    try { if (!getSessionAccount()) location.replace('login/classic.html'); }
    catch (e) { location.replace('login/classic.html'); }
  })();
  });
</script>
  <script src="theme-bootstrap.js?v=1.4.33"></script>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-back" onclick="goBack()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title">基础数据</span>
  </div>

  <div class="wrap">
    <p class="section-desc">集中维护各类基础数据，便于任务归类与统计。</p>
    <div class="module-list" id="moduleList"></div>
  </div>

  <script>
    // 基础数据模块清单：新增模块只需在此追加一项（href 指向对应页面）。
    // icon 为内联 SVG 字符串，name/desc 为展示文案。sort 控制排序（升序）。
    var MODULES = [
      { sort: 10, name: '公司管理',       desc: '维护总公司 / 分公司层级与基础信息',                         href: 'company.html',        icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('company')) || '' },
      { sort: 20, name: '部门管理',       desc: '维护部门名称、编号与层级（归属公司）',                       href: 'department.html',     icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('department')) || '' },
      { sort: 30, name: '职位管理',       desc: '维护职位名称、编码与职级',                                 href: 'position.html',       icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('position')) || '' },
      { sort: 40, name: '人员管理',       desc: '维护人员账号、部门 / 职位归属与联系方式',                   href: 'user.html',           icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('user')) || '', perm: 'page_user_view' },
      { sort: 50, name: '项目管理',       desc: '维护项目名称、描述与所属部门',                             href: 'project.html',        icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('project')) || '' },
      { sort: 60, name: '项目版本管理',   desc: '维护版本名称、描述与所属项目',                             href: 'project-version.html', icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('project-version')) || '' },
      { sort: 70, name: '角色管理',       desc: '维护角色与权限分配（启用 / 停用 / 分配人员）',             href: 'role.html',           icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('role')) || '', perm: 'page_role_view' },
      { sort: 80, name: '权限管理',       desc: '维护页面权限按钮（模块 / 页面 / 操作三级）',               href: 'permission.html',     icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('permission')) || '', perm: 'page_perm_view' },
      { sort: 90, name: '字典管理',       desc: '系统枚举（任务类型 / 优先级 / 任务状态），仅查看',          href: 'dictionary.html',     icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('dictionary')) || '' },
      { sort: 100, name: '图标管理', desc: '统一管理各页面图标（默认 13 个 + 可自定义），支持编辑 / 恢复默认 / 导出', href: 'icon-manager.html', icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('icon-manager')) || '', perm: 'page_icon_manager_view' },
      { sort: 110, name: '工作流管理', desc: '定义审批/业务流程的节点、流转规则与关联对象', href: 'workflow.html', icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('workflow')) || '', perm: 'page_workflow_view' },
      { sort: 120, name: '流程管理', desc: '配置流程表单模板（字段类型）并关联工作流', href: 'process.html', icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('process')) || '', perm: 'page_process_view' },
      { sort: 130, name: '流程审批', desc: '发起流程、按工作流节点审批（同意 / 驳回 / 转办 / 加签）', href: 'process-instances.html', icon: (window.RT_PAGE_ICONS && RT_PAGE_ICONS.get('process')) || '', perm: 'page_process_instance_view' }
    ];


    function applyGuard(){
      if (typeof RT_PERM !== 'undefined' && RT_PERM.guard) { RT_PERM.guard(document); }
    }

    function render(){
      var box = document.getElementById('moduleList');
      var sorted = MODULES.slice().sort(function(a, b) { return (a.sort || 999) - (b.sort || 999); });
      box.innerHTML = sorted.map(function(m){
        return '<div class="module-row"' + (m.perm ? ' data-perm="' + m.perm + '"' : '') + ' onclick="navTo(\'' + m.href + '\')">'
          + '<div class="module-icon">' + m.icon + '</div>'
          + '<div class="module-main">'
          + '<div class="module-name">' + escapeHtml(m.name) + '</div>'
          + '<div class="module-desc">' + escapeHtml(m.desc) + '</div>'
          + '</div>'
          + '<svg class="module-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>'
          + '</div>';
      }).join('');
      applyGuard();
    }
    render();

    registerAppSW();
  </script>
</body>
</html>
