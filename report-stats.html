<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>考勤工时统计</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="base.css?v=1.4.29" />
<link rel="stylesheet" href="layout.css?v=1.4.29" />
<link rel="stylesheet" href="components.css?v=1.4.29" />
<link rel="stylesheet" href="pages.css?v=1.4.29" />
<link rel="stylesheet" href="overlays.css?v=1.4.29" />
<link rel="stylesheet" media="print" href="print.css?v=1.4.29" />
<style>
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
  button, a, input, select, textarea, [onclick] { outline: none; }
  button:focus:not(:focus-visible),
  a:focus:not(:focus-visible),
  [onclick]:focus:not(:focus-visible),
  input:focus:not(:focus-visible),
  select:focus:not(:focus-visible),
  textarea:focus:not(:focus-visible) { outline: none; }

  .wrap{max-width:560px;margin:0 auto;padding:8px 14px calc(env(safe-area-inset-bottom) + 40px)}
  .section-desc{font-size:13px;color:var(--muted,#6b7280);line-height:1.6;margin:2px 4px 8px}

  .perm-denied{text-align:center;padding:60px 20px;color:var(--muted,#9ca3af);font-size:15px;line-height:1.8}
  .perm-denied svg{display:block;margin:0 auto 16px;opacity:.35}

  @media print {
    @page { size: A4; margin: 12mm; }
    .nav-bar, .report-toolbar { display: none !important; }
    body { background: #fff; }
    .st-head { border-bottom: 1px solid #eee; }
  }
</style>
<script src="auth.js?v=1.4.29" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
  (function () {
    try { if (!getSessionAccount()) location.replace('login/classic.html'); }
    catch (e) { location.replace('login/classic.html'); }
  })();
  });
</script>
  <script src="theme-bootstrap.js?v=1.4.29"></script>
</head>
<body>
  <div class="nav-bar">
    <button class="nav-back" onclick="goBack()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title" data-i18n="report.stats.title">考勤工时统计</span>
  </div>

  <div class="wrap">
    <p class="section-desc" data-i18n="report.stats.desc">按日/周/综合汇总打卡、工时、迟到早退缺勤与任务状态分布</p>

    <!-- 有权限时的统计视图容器（导出 PDF 按钮已移入视图内「今天」左侧） -->
    <div id="view-stats" data-perm="op_report_stats_view"></div>

    <!-- 无权限时的后备内容 -->
    <div class="perm-denied" id="permDenied" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span data-i18n="report.stats.noPerm">无权限查看考勤工时统计</span>
    </div>
  </div>

  <script src="config.js?v=1.4.29" defer></script>
  <script src="db.js?v=1.4.29" defer></script>
  <script src="dictionary.js?v=1.4.29" defer></script>
  <script src="projects.js?v=1.4.29" defer></script>
  <script src="project-versions.js?v=1.4.29" defer></script>
  <script src="requirement-tasks.js?v=1.4.29" defer></script>
  <script src="task-lifecycles.js?v=1.4.29" defer></script>
  <script src="todos.js?v=1.4.29" defer></script>
  <script src="todo-lifecycles.js?v=1.4.29" defer></script>
  <script src="attendance.js?v=1.4.29" defer></script>
  <script src="holidays.js?v=1.4.29" defer></script>
  <script src="leave.js?v=1.4.29" defer></script>
  <script src="dayfacts.js?v=1.4.29" defer></script>
  <script src="stats.js?v=1.4.29" defer></script>
  <script src="stats-view.js?v=1.4.29" defer></script>
  <script src="users.js?v=1.4.29" defer></script>
  <script src="permissions-registry.js?v=1.4.29" defer></script>
  <script src="permissions.js?v=1.4.29" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 权限门控：有 view 权限则渲染统计视图，否则显示无权限提示
      var statsEl = document.getElementById('view-stats');
      var deniedEl = document.getElementById('permDenied');
      if (!statsEl || !deniedEl) return;

      if (window.RT_PERM && RT_PERM.can('page_report_stats', 'view')) {
        deniedEl.hidden = true;
        statsEl.style.display = '';
        if (window.RT_STATS_VIEW) {
          RT_STATS_VIEW.renderInto(statsEl);
        }
      } else {
        statsEl.style.display = 'none';
        deniedEl.hidden = false;
      }

      // 权限门控：按 data-perm 属性隐藏/显示元素
      if (window.RT_PERM) RT_PERM.guard(document);
    });
  </script>
</body>
</html>
