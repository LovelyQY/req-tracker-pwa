<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>登录设备</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
:root{
  --primary:#1677ff; --primary-light:#4096ff; --bg:#f5f7fa; --surface:#fff;
  --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --radius:14px; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,[onclick]{outline:none}
button:focus:not(:focus-visible),a:focus:not(:focus-visible),[onclick]:focus:not(:focus-visible),input:focus:not(:focus-visible),select:focus:not(:focus-visible),textarea:focus:not(:focus-visible){outline:none}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh; padding:0; -webkit-font-smoothing:antialiased;
}
.nav-bar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;height:52px;padding:0 16px 0 4px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:calc(env(safe-area-inset-top) + 8px);
}
.nav-back{width:36px;height:36px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.nav-back svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;text-align:center;position:absolute;left:0;right:0;pointer-events:none}

.wrap{max-width:560px;margin:0 auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 40px)}
.set-group-title{font-size:13px;color:var(--muted);font-weight:600;margin:18px 4px 8px}
.set-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);min-height:56px}
.set-row:last-child{border-bottom:none}
.set-row-main{flex:1;min-width:0}
.set-row-title{font-size:15px;font-weight:600}
.set-row-sub{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-all}
.empty-tip{text-align:center;color:var(--muted);font-size:14px;padding:48px 16px;line-height:1.7}

/* 轻量 toast（与 config.js toast() 共用，确保本页独立可用） */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
  display:flex;align-items:center;gap:8px;max-width:90vw;padding:10px 16px;border-radius:12px;
  background:rgba(31,41,55,.94);color:#fff;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
  <script src="auth.js?v=1.4.25" defer></script>
  <script src="config.js?v=1.4.25" defer></script>
  <script src="theme-bootstrap.js?v=1.4.25"></script>
  <script src="ui-utils.js?v=1.4.25"></script>
  <script src="permissions-registry.js?v=1.4.25" defer></script>
  <script src="permissions.js?v=1.4.25" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    (function () {
      try { if (!getSessionAccount()) location.replace('login/classic.html'); }
      catch (e) { location.replace('login/classic.html'); }
    })();
  });
  </script>
  <script src="sw-register.js?v=1.4.25"></script>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-back" onclick="goBack()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title" data-i18n="devices.title">登录设备</span>
  </div>

  <div class="wrap">
    <div class="set-group-title" data-i18n="devices.current">当前设备</div>
    <div class="set-group">
      <div class="set-row"><div class="set-row-main"><div class="set-row-title" data-i18n="devices.device">设备</div><div class="set-row-sub" id="dv-ua">—</div></div></div>
      <div class="set-row"><div class="set-row-main"><div class="set-row-title" data-i18n="devices.account">账号</div><div class="set-row-sub" id="dv-acc">—</div></div></div>
      <div class="set-row"><div class="set-row-main"><div class="set-row-title" data-i18n="devices.loginTime">登录时间</div><div class="set-row-sub" id="dv-login-time">—</div></div></div>
      <div class="set-row"><div class="set-row-main"><div class="set-row-title" data-i18n="devices.loginMethod">登录方式</div><div class="set-row-sub" data-i18n="devices.localSession">本机会话</div></div></div>
    </div>

    <div class="set-group-title" data-i18n="devices.other">其他设备</div>
    <div class="set-group">
      <div class="empty-tip" data-i18n="devices.otherHint">历史登录设备列表与「登出其他设备」需要云端后端支持（阶段 0 后端就绪后上线）。当前仅显示本机会话。</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function prettyUA(ua) {
      ua = ua || '';
      var os = '未知系统', br = '未知浏览器';
      if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
      else if (/Android/i.test(ua)) os = 'Android';
      else if (/Windows/i.test(ua)) os = 'Windows';
      else if (/Mac OS X|Macintosh/i.test(ua)) os = 'macOS';
      else if (/Linux/i.test(ua)) os = 'Linux';
      if (/Edg\//i.test(ua)) br = 'Edge';
      else if (/HuaweiBrowser|Huawei/i.test(ua)) br = '华为浏览器';
      else if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) br = 'Chrome';
      else if (/Firefox\//i.test(ua)) br = 'Firefox';
      else if (/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) br = 'Safari';
      return br + ' · ' + os;
    }
    function renderDevices() {
      var acc = (typeof getSessionAccount === 'function') ? getSessionAccount() : null;
      var s = (typeof getSession === 'function') ? getSession() : null;
      var uaEl = document.getElementById('dv-ua');
      var accEl = document.getElementById('dv-acc');
      var ltEl = document.getElementById('dv-login-time');
      if (uaEl) uaEl.textContent = prettyUA(navigator.userAgent || '');
      if (accEl) accEl.textContent = acc || '—';
      // 批次 205 #6：真实登录时间来自登录时写入会话的 loginAt；旧会话无此字段则显示 —
      if (ltEl) {
        if (s && s.loginAt) {
          var lc = (typeof RT_I18N_API !== 'undefined' && RT_I18N_API.currentLang) ? RT_I18N_API.currentLang : 'zh-CN';
          ltEl.textContent = new Date(s.loginAt).toLocaleString(lc, { hour12: false });
        } else {
          ltEl.textContent = '—';
        }
      }
      if (typeof RT_PERM !== 'undefined' && RT_PERM.guard) { try { RT_PERM.guard(document); } catch (e) {} }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderDevices);
    else renderDevices();
    if (typeof onPageShow === 'function') onPageShow(renderDevices);
    if (typeof registerAppSW === 'function') registerAppSW();
  </script>
</body>
</html>
