<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>图标管理</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="theme.css?v=1.4.07">
<link rel="stylesheet" href="overlays.css?v=1.4.07" />
<style>
:root{
  --primary:#1677ff; --primary-light:#4096ff; --primary-dark:#0958d9;
  --bg:#f5f7fa; --surface:#fff;
  --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --radius:14px;
  --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,[onclick]{outline:none}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;padding:0;-webkit-font-smoothing:antialiased;
}

/* 顶部导航 */
.nav-bar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;height:52px;padding:0 8px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding-top:calc(env(safe-area-inset-top) + 8px)}
.nav-back{width:40px;height:40px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.nav-back svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;text-align:center;position:absolute;left:0;right:0;pointer-events:none}
.nav-actions{margin-left:auto;display:flex;gap:8px}

/* 主体两栏 */
.wrap{max-width:860px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 40px);display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:680px){ .wrap{grid-template-columns:1fr} }

/* 卡片 */
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,#f5f9ff,#eef4ff)}
.card-head .h-title{font-size:15px;font-weight:700}
.card-head .h-note{margin-left:auto;font-size:12px;color:var(--muted)}

/* 列表项 */
.icon-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.icon-item:last-child{border-bottom:none}
.icon-item:hover{background:#f8fbff}
.icon-item.active{background:#eef4ff}
.icon-item .pv{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:var(--icon-fg);background:var(--icon-bg);border-radius:var(--icon-radius);
  box-shadow:var(--icon-shadow)}
.icon-item .pv svg{width:22px;height:22px}
.icon-item .ik{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:600;color:var(--text);word-break:break-all}
.icon-item .badge{font-size:11px;padding:2px 8px;border-radius:999px;flex-shrink:0}
.badge.override{background:#e6f0ff;color:var(--primary)}
.badge.default{background:#f1f5f9;color:var(--muted)}
.icon-item .reset{font-size:12px;color:#ef4444;background:none;border:none;cursor:pointer;flex-shrink:0;padding:4px 6px}
.icon-item .reset:hover{text-decoration:underline}

/* 编辑面板 */
.editor{position:sticky;top:66px;align-self:start}
.editor .sel{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:700;color:var(--text);word-break:break-all;margin-bottom:10px}
.editor .sel .src{font-size:11px;font-weight:600;margin-left:8px}
.editor .preview{display:flex;align-items:center;justify-content:center;width:96px;height:96px;margin:0 auto 12px;
  background:var(--icon-bg);border-radius:var(--icon-radius);color:var(--icon-fg)}
.editor .preview svg{width:56px;height:56px}
/* 批次164/167：SVG 源码只读展示（浅色代码块） */
.code-block{background:#f8fafc;color:#334155;border:1px solid var(--border);border-radius:10px;padding:14px;overflow:auto;max-height:280px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.code-block code{background:none;padding:0;font:inherit}
.editor .btns{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;height:42px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:#f1f5f9;color:var(--text)}
.btn-primary{background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff}
.btn-ghost{background:#f1f5f9;color:var(--text)}
.btn-danger{background:#fff1f0;color:#ef4444;border:1px solid #ffccc7}
.btn:active{opacity:.85}

.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;line-height:1.7}
/* 批次165：页面级静态说明（图标尺寸提示） */
.page-hint{font-size:12px;color:var(--muted);margin:0 0 12px;padding:0 4px;line-height:1.5}

</style>
<script src="auth.js?v=1.4.07" defer></script>
<script src="sw-register.js?v=1.4.07"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
  // 登录闸门：无效会话跳转登录页
  (function () {
    try { if (!getSessionAccount()) location.replace('login/classic.html'); }
    catch (e) { location.replace('login/classic.html'); }
  })();
  });
</script>
  <script src="theme-bootstrap.js?v=1.4.07"></script>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-back" onclick="goBack()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title">图标管理</span>
    <div class="nav-actions">
      <button class="btn btn-ghost" data-perm="op_icon_manager_edit" id="btnExport" style="height:36px;flex:none;padding:0 14px;font-size:13px">导出全部</button>
      <button class="btn btn-ghost" data-perm="op_icon_manager_edit" id="btnImport" style="height:36px;flex:none;padding:0 14px;font-size:13px">导入</button>
      <input type="file" id="import-icons-file" accept="application/json,.json" hidden />
    </div>
  </div>

  <div class="wrap">
    <p class="page-hint">图标在各页面以 44×44 尺寸展示（芯片框）。</p>
    <div class="card">
      <div class="card-head"><span class="h-title">页面图标</span><span class="h-note" id="listCount"></span></div>
      <div id="list"></div>
    </div>

    <div class="card editor">
      <div class="card-head"><span class="h-title">详情</span><span class="h-note">图标预览</span></div>
      <div style="padding:16px">
        <div class="sel" id="selKey">未选择</div>
        <div class="preview" id="preview"></div>
        <div id="svgCode" class="code-block"><code id="svgCodeText"></code></div>
        <div class="btns">
          <button class="btn btn-danger" data-perm="op_icon_manager_edit" id="btnReset">恢复默认</button>
          <button class="btn btn-ghost" data-perm="op_icon_manager_edit" id="btnResetAll">批量恢复</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span class="toast-icon">!</span><span class="toast-msg"></span></div>

  <script src="config.js?v=1.4.07" defer></script>
  <script src="db.js?v=1.4.07" defer></script>
  <script src="permissions-registry.js?v=1.4.07" defer></script>
  <script src="permissions.js?v=1.4.07" defer></script>
  <script src="ui-utils.js?v=1.4.07"></script>
  <script src="page-icons.js?v=1.4.07" defer></script>
  <script src="icon-manager.js?v=1.4.07" defer></script>
  <script>
    registerAppSW();
  </script>
</body>
</html>
