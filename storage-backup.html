<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#1677ff" />
  <title>存储与备份</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/favicon-32.png" />
  <link rel="stylesheet" href="base.css?v=1.4.14" />
  <link rel="stylesheet" href="layout.css?v=1.4.14" />
  <link rel="stylesheet" href="components.css?v=1.4.14" />
  <link rel="stylesheet" href="pages.css?v=1.4.14" />
  <link rel="stylesheet" href="overlays.css?v=1.4.14" />
  <link rel="stylesheet" href="theme.css?v=1.4.14" />
  <link rel="stylesheet" media="print" href="print.css?v=1.4.14" />
  <script src="auth.js?v=1.4.14" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // 登录闸门：无效会话跳转登录页
    (function () {
      try { if (!getSessionAccount()) location.replace('login/classic.html'); }
      catch (e) { location.replace('login/classic.html'); }
    })();
  });
</script>
  <style>
  /* 顶部导航返回按钮与标题（拆分后的 layout.css 已提供 .nav-bar / .container，此处仅补按钮与标题） */
  .nav-back{
    width:40px;height:40px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)
  }
  .nav-back svg{width:22px;height:22px}
  .nav-title{font-size:17px;font-weight:700;text-align:center;position:absolute;left:0;right:0;flex:none;pointer-events:none}

  /* 批次155：双入口 landing 列表（基础数据式，图标视觉沿用 theme.css 变量） */
  .module-list{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .module-row{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);
    border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;transition:background .12s}
  .module-row:last-child{border-bottom:none}
  .module-row:active{background:#f2f4f7}
  .module-icon{flex-shrink:0;width:44px;height:44px;border-radius:var(--icon-radius);
    display:flex;align-items:center;justify-content:center;color:var(--icon-fg);
    background:var(--icon-bg);box-shadow:var(--icon-shadow)}
  .module-main{flex:1;min-width:0}
  .module-name{font-size:16px;font-weight:600}
  .module-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .module-arrow{color:#c7ccd4;flex-shrink:0}

  /* 批次161：去卡片化 — 数据备份 / 存储与数据 子视图改为纯分区风格（仅本页生效，不动 pages.css 全局） */
  .settings-section{
    background:transparent;
    border-radius:0;
    box-shadow:none;
    padding:4px 0;
    margin-bottom:18px;
  }
  /* 子视图内 .settings-item 一并扁平化（存储与数据页三行：已用空间 / 配额上限 / 持久化存储） */
  .settings-section .settings-item{
    background:transparent;
    border-radius:0;
    border-bottom:1px solid var(--border);
    padding:10px 0;
  }
  .settings-section .settings-item:last-child{border-bottom:none}
  </style>
  <script src="theme-bootstrap.js?v=1.4.14"></script>
</head>
<body>

  <div class="nav-bar">
    <button class="nav-back" onclick="storagePageBack()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title" id="navTitle">存储与备份</span>
  </div>

  <div class="container">

    <!-- 双入口 landing 列表（基础数据式） -->
    <div id="landingView" class="module-list"></div>

    <!-- 数据备份 -->
    <div id="backupView" hidden>
    <div class="settings-section">
      <p class="backup-tip">数据仅保存在本机浏览器。建议定期导出备份；换设备或清除浏览器数据前，务必先备份以免任务丢失。</p>
      <div class="backup-actions">
        <button class="btn primary" id="btn-export" type="button" data-perm="op_storage_view">导出备份</button>
        <button class="btn ghost" id="btn-import" type="button">导入备份</button>
      </div>
      <p class="backup-tip mt-10">导出：把全部基础数据（人员/部门/职位/公司/项目/需求任务/待办/生命周期等，含账号信息）保存到本地文件。导入：从备份文件恢复数据（将覆盖当前内容）。</p>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>

    </div>

      <!-- 存储与数据 -->
      <div id="storageView" hidden>
      <div class="settings-section">
        <p class="backup-tip">图片与附件保存在浏览器本地（IndexedDB），与本机磁盘共享配额；Base64 存储会比原文件大约 33%。开启「持久化存储」可防止系统清理时数据被误删（iOS / 存储紧张设备尤其建议）。</p>
        <div class="settings-list">
          <div class="settings-item">
            <span>已用空间</span>
            <span id="storage-usage">—</span>
          </div>
          <div class="settings-item">
            <span>配额上限</span>
            <span id="storage-quota">—</span>
          </div>
          <div class="settings-item">
            <span>持久化存储</span>
            <span id="storage-persist">—</span>
          </div>
        </div>
        <div class="backup-actions">
          <button class="btn primary" id="btn-persist" type="button">开启持久化存储</button>
        </div>
        <p class="backup-tip mt-10" id="storage-tip"></p>
      </div>
      </div>

  </div>

  <div class="toast" id="toast">
    <span class="toast-icon">!</span>
    <span class="toast-msg"></span>
  </div>

  <script src="config.js?v=1.4.14" defer></script>
  <script src="media-store.js?v=1.4.14" defer></script>
  <script src="page-icons.js?v=1.4.14" defer></script>
  <script src="storage-backup.js?v=1.4.14" defer></script>
  <script src="permissions-registry.js?v=1.4.14" defer></script>
  <script src="permissions.js?v=1.4.14" defer></script>
</body>
</html>
