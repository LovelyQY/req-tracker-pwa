<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta http-equiv="Pragma" content="no-cache">

<title>流程管理</title>

<link rel="icon" href="icons/favicon-32.png">
<style>
:root{
  --primary:#1677ff; --primary-light:#4096ff; --bg:#f5f7fa; --surface:#fff;
  --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --radius:14px; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,[onclick]{outline:none}
button:focus:not(:focus-visible),a:focus:not(:focus-visible),[onclick]:focus:not(:focus-visible),input:focus:not(:focus-visible),select:focus:not(:focus-visible),textarea:focus:not(:focus-visible){outline:none}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh; padding:0; -webkit-font-smoothing:antialiased;
}

/* 顶部导航 */
.nav-bar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;height:52px;padding:0 8px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:calc(env(safe-area-inset-top) + 8px);
}
.nav-back{width:40px;height:40px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.nav-back svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;text-align:center;position:absolute;left:0;right:0;pointer-events:none}
.nav-action{margin-left:auto;font-size:15px;font-weight:600;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,#1677ff,#4096ff);border-radius:10px;padding:8px 14px;
  box-shadow:0 4px 12px rgba(22,119,255,.3);-webkit-tap-highlight-color:transparent}
.nav-action:active{transform:translateY(1px)}
.nav-action.ghost{margin-left:0;background:#fff;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}

.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 90px)}

/* 搜索框 */
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;padding:0 12px;height:44px;margin-bottom:14px}
.search-box .ic{color:var(--muted);flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;background:none;font-size:15px;height:100%;color:var(--text)}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,#f5f9ff,#eef4ff)}
.card-head .gname{font-size:15px;font-weight:700;word-break:break-all}
.card-head .gcode{font-size:12px;color:var(--primary);background:#eff6ff;padding:2px 8px;border-radius:999px;font-weight:600}
.card-head .gid{font-size:11px;color:var(--muted)}
.card-body{padding:12px 16px}
.card-desc{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:10px;word-break:break-all}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eff6ff;color:var(--primary)}
.tag.warn{background:#fef3e7;color:#d97706}
.tag.ok{background:#ecfdf5;color:#16a34a}
.tag.tpl{background:#f3effe;color:#7c3aed}
.meta-line{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.acts{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:active{background:#f2f4f7}
.icon-btn.danger{color:var(--danger);border-color:#fecaca}
.icon-btn.danger:active{background:#fef2f2}
.icon-btn svg{width:17px;height:17px}

/* 空状态 */
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.7}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}

/* 底部抽屉表单 */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
.sheet-mask.show{display:block}
.sheet{position:fixed;inset:0;left:0;right:0;top:0;bottom:0;z-index:101;background:var(--surface);max-width:none;width:100%;height:100dvh;border-radius:0;transform:none;transition:none;display:none;flex-direction:column;padding:0;overflow:hidden}
.sheet-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 14px}
.sheet.show{display:flex}
.sheet-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field label .max{float:right;color:#c7ccd4;font-weight:400}
.field input, .field select, .field textarea{width:100%;padding:0 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:15px;background:#fafbfc;outline:none;color:var(--text);transition:.2s;font-family:inherit}
.field input, .field select{height:48px}
.field textarea{min-height:84px;padding:12px 14px;resize:vertical;line-height:1.6}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(22,119,255,.12)}
.field input.invalid, .field select.invalid, .field textarea.invalid{border-color:var(--danger);background:#fff5f5}
.field input[readonly]{background:#f1f5f9;color:var(--muted);cursor:not-allowed}
.field .err{display:none;color:var(--danger);font-size:12px;margin-top:5px}
.field .err.show{display:block}
.checkbox-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.checkbox-item{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);cursor:pointer}
.checkbox-item input{width:18px;height:18px}
.readonly-meta{background:#f8fafc;border:1px dashed var(--border);border-radius:12px;padding:12px 14px;
  font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:14px}
.readonly-meta b{color:var(--text);font-weight:600}
.sheet-actions{display:flex;gap:12px;position:sticky;bottom:0;z-index:2;background:var(--surface);padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--border);margin-top:0}
.btn{flex:1;height:50px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;border:none}
.btn-ghost{flex:0 0 38%;border:1.5px solid var(--border);background:#fff;color:var(--text)}
.btn-primary{background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;box-shadow:0 8px 18px rgba(22,119,255,.32)}
.btn-primary:active{transform:translateY(1px)}

/* 表单模板配置 */
.tpl-section{background:#fafbff;border:1.5px dashed #c7d7ff;border-radius:14px;padding:12px;margin-bottom:14px}
.tpl-hint{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.tpl-add{width:100%;height:42px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);
  border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.tpl-add:active{background:#eff6ff}
.tpl-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.tpl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tpl-idx{font-size:12px;font-weight:700;color:var(--primary)}
.tpl-empty{font-size:13px;color:var(--muted);text-align:center;padding:14px 0}

/* 删除确认浮层 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.show{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:22px 20px 18px;width:100%;max-width:320px;text-align:center}
.modal h3{font-size:17px;font-weight:700;margin-bottom:8px}
.modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:18px;word-break:break-all}
.modal .modal-actions{display:flex;gap:12px}
.modal .btn{flex:1;height:46px;font-size:15px}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:active{transform:translateY(1px)}

/* toast */
</style>

  <div class="nav-bar">
    <button class="nav-back" onclick="goBack()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title" data-i18n="process.title">流程管理</span>

  </div>

  <div class="wrap">

    <div class="search-box">
      <span class="ic"><svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="10" cy="10" r="6" fill="#9ca3af" fill-opacity="0.15" stroke="#9ca3af" stroke-width="2.5"/><path d="M15 15 L20 20" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/></svg></span>
      <input id="search" type="search" data-i18n-ph="process.searchPlaceholder" placeholder="搜索流程名称 / 编码 / ID" oninput="render()">
    </div>
    <div id="list"></div>
  </div>

  <!-- 新增/编辑 抽屉 -->
  <div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
  <div class="nav-bar">
    <button class="nav-back" onclick="closeSheet()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title" id="sheetTitle" data-i18n="process.addSheet">新增流程</span>
  </div>
  <div class="sheet-body">

    <div class="readonly-meta" id="metaBox" style="display:none"></div>
    <div class="field">
      <label data-i18n="process.code">流程编码</label>
      <input id="f-code" type="text" readonly placeholder="系统自动生成">
      <div class="err" id="err-code"></div>
    </div>
    <div class="field">
      <label data-i18n="process.name">流程名称</label> <span class="max" id="maxName">0/50</span>
      <input id="f-name" type="text" maxlength="50" data-i18n-ph="process.namePlaceholder" placeholder="如：需求评审流程" oninput="updateCounter('f-name','maxName',50);clearErr('name')">
      <div class="err" id="err-name"></div>
    </div>
    <div class="field">
      <label data-i18n="process.description">流程描述</label> <span class="max" id="maxDesc">0/200</span>
      <textarea id="f-desc" maxlength="200" data-i18n-ph="process.descriptionPlaceholder" placeholder="简要说明该流程的用途" oninput="updateCounter('f-desc','maxDesc',200);clearErr('description')"></textarea>
      <div class="err" id="err-description"></div>
    </div>
    <div class="field">
      <label data-i18n="process.workflowId">关联工作流（从已有工作流中选择）</label>
      <select id="f-workflow"><option value="" data-i18n="common.select">请选择关联工作流</option></select>
      <div class="err" id="err-workflowId"></div>
    </div>

    <!-- 表单模板配置 -->
    <div class="tpl-section">
      <label data-i18n="process.formTemplate" style="margin-bottom:6px">表单模板</label>
      <div class="tpl-hint" data-i18n="process.formTemplateHint"></div>
      <button class="tpl-add" type="button" onclick="addField()" data-i18n="process.addField">+ 添加字段</button>
      <div id="formTemplate"></div>
    </div>

    <div class="field">
      <label data-i18n="process.iconKey">图标</label>
      <select id="f-icon"><option value="process">process（默认）</option></select>
    </div>
    <div class="field">
      <label data-i18n="process.sort">排序权重（数字越小越靠前）</label>
      <input id="f-sort" type="number" value="0" min="0" step="1">
    </div>
    <div class="field">
      <label data-i18n="process.enabled">是否启用</label>
      <div class="checkbox-row">
        <label class="checkbox-item"><input type="checkbox" id="f-enabled" checked> <span data-i18n="common.enabled">启用</span></label>
      </div>
    </div>
    </div>
  <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()" data-i18n="common.cancel">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="save()" data-i18n="common.save">保存</button>

  <!-- 删除确认 -->
  <div class="modal-mask" id="confirmMask">

      <h3 data-i18n="confirm.deleteTitle">删除确认</h3>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeConfirm()" data-i18n="common.cancel">取消</button>

  <script>
    var editingId = null;
    var deletingId = null;
    // 表单模板字段（内存数组，渲染时写回 DOM）
    var tmplFields = [];

    // 字段类型 → 字面量 i18n key（满足静态扫描）
    var FIELD_TYPE_LABEL_KEYS = {
      text: 'process.field.text', textarea: 'process.field.textarea', select: 'process.field.select',
      multiselect: 'process.field.multiselect', image: 'process.field.image', attachment: 'process.field.attachment'
    };
    var FIELD_TYPES = ['text', 'textarea', 'select', 'multiselect', 'image', 'attachment'];

    // ---------- 列表渲染 ----------
    function render(){
      if (typeof RT_PROCESSES === 'undefined') { showErr(t('common.moduleNotLoaded')); return; }
      var q = ($('search').value || '').trim().toLowerCase();
      var wfMap = {};
      var wfReady = (typeof RT_WORKFLOWS !== 'undefined')
        ? RT_WORKFLOWS.getAllWorkflows().then(function(list){
            (list || []).forEach(function(w){ wfMap[w.id] = w; });
          }).catch(function(){ })
        : Promise.resolve();
      wfReady.then(function(){
        return RT_PROCESSES.getAllProcesses();
      }).then(function(list){
        if (q) {
          list = list.filter(function(r){
            return (r.name + '').toLowerCase().indexOf(q) >= 0
              || (r.code + '').toLowerCase().indexOf(q) >= 0
              || (r.id + '').toLowerCase().indexOf(q) >= 0;
          });
        }
        var box = $('list');
        if (!list.length) {
          box.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/></svg>'
            + '<div>' + (q ? t('common.noMatch') : t('process.emptyHint')) + '</div></div>';
          applyGuard();
          return;
        }
        var html = '';
        list.forEach(function(r){
          var wf = wfMap[r.workflowId];
          var wfName = wf ? (wf.name + (wf.code ? '（' + wf.code + '）' : '')) : (r.workflowId || '—');
          var tplCount = (r.formTemplate && r.formTemplate.length) ? r.formTemplate.length : 0;
          var tags = '';
          tags += '<span class="tag">' + escapeHtml(wfName) + '</span>';
          tags += '<span class="tag tpl">' + escapeHtml(t('process.formTemplate')) + '：' + tplCount + '</span>';
          var statusBadge = r.enabled
            ? '<span class="tag ok">' + t('process.enabledOn') + '</span>'
            : '<span class="tag warn">' + t('process.enabledOff') + '</span>';
          var sub = t('common.created') + '：' + escapeHtml(r.createdBy || '—') + ' · ' + fmtTime(r.createdAt)
            + (r.updatedBy ? '<br>' + t('common.updated') + '：' + escapeHtml(r.updatedBy) + ' · ' + fmtTime(r.updatedAt) : '');
          html += '<div class="card">'
            + '<div class="card-head">'
            + '<span class="gcode">' + escapeHtml(r.code) + '</span>'
            + '<span class="gname">' + escapeHtml(r.name) + '</span>'
            + '</div>'
            + '<div class="card-body">'
            + (r.description ? '<div class="card-desc">' + escapeHtml(r.description) + '</div>' : '')
            + '<div class="tag-row">' + tags + statusBadge + '</div>'
            + '<div class="meta-line">' + sub + '</div>'
            + '</div>'
            + '<div style="display:flex;padding:0 16px 14px;justify-content:flex-end">'
            + '<div class="acts">'
            + '<button class="icon-btn" data-perm="op_process_edit" aria-label="编辑" onclick="openEdit(\'' + r.id + '\')">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
            + '<button class="icon-btn danger" data-perm="op_process_delete" aria-label="删除" onclick="openConfirm(\'' + r.id + '\')">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>'
            + '</div></div>'
            + '</div>';
        });
        box.innerHTML = html;
        applyGuard();
      }).catch(function(err){ showErr(t('common.loadFailed') + (err && err.message ? err.message : err)); });
    }

    // ---------- 表单模板渲染 ----------
    function renderTemplate(){
      var box = $('formTemplate');
      if (!tmplFields.length) {
        box.innerHTML = '<div class="tpl-empty">' + escapeHtml(t('process.addField')) + '</div>';
        return;
      }
      var html = '';
      tmplFields.forEach(function(f, i){
        var isOpt = (f.type === 'select' || f.type === 'multiselect');
        var opts = '';
        FIELD_TYPES.forEach(function(tp){
          opts += '<option value="' + tp + '"' + (f.type === tp ? ' selected' : '') + '>' + escapeHtml(t(FIELD_TYPE_LABEL_KEYS[tp])) + '</option>';
        });
        html += '<div class="tpl-card">'
          + '<div class="tpl-head"><span class="tpl-idx">#' + (i + 1) + '</span>'
          + '<button class="icon-btn danger" type="button" onclick="removeField(' + i + ')" aria-label="删除字段">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'
          + '<div class="field" style="margin-bottom:10px"><label>' + escapeHtml(t('process.fieldLabel')) + '</label>'
          + '<input type="text" value="' + escapeHtml(f.label || '') + '" oninput="updateField(' + i + ',\'label\',this.value)" placeholder="如：请假事由"></div>'
          + '<div class="field" style="margin-bottom:10px"><label>' + escapeHtml(t('process.fieldType')) + '</label>'
          + '<select onchange="updateField(' + i + ',\'type\',this.value); onTypeChange(' + i + ')">' + opts + '</select></div>'
          + '<div class="tpl-opts" id="ft-opts-' + i + '" style="display:' + (isOpt ? 'block' : 'none') + '">'
          + '<div class="field" style="margin-bottom:10px"><label>' + escapeHtml(t('process.fieldOptions')) + '</label>'
          + '<textarea oninput="updateField(' + i + ',\'options\',this.value)" placeholder="选项一\n选项二">' + escapeHtml((f.options || []).join('\n')) + '</textarea></div></div>'
          + '<div class="field" style="margin-bottom:10px"><label>' + escapeHtml(t('process.fieldPlaceholder')) + '</label>'
          + '<input type="text" value="' + escapeHtml(f.placeholder || '') + '" oninput="updateField(' + i + ',\'placeholder\',this.value)"></div>'
          + '<div class="checkbox-row"><label class="checkbox-item"><input type="checkbox" ' + (f.required ? 'checked' : '') + ' onchange="updateField(' + i + ',\'required\',this.checked)"> <span>' + escapeHtml(t('process.fieldRequired')) + '</span></label></div>'
          + '</div>';
      });
      box.innerHTML = html;
    }
    function addField(){
      tmplFields.push({ id: '', label: '', type: 'text', options: [], required: false, placeholder: '' });
      renderTemplate();
    }
    function removeField(i){
      tmplFields.splice(i, 1);
      renderTemplate();
    }
    function updateField(i, prop, val){
      if (!tmplFields[i]) return;
      if (prop === 'options') {
        tmplFields[i].options = String(val).split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
      } else {
        tmplFields[i][prop] = val;
      }
    }
    function onTypeChange(i){
      if (!tmplFields[i]) return;
      var isOpt = (tmplFields[i].type === 'select' || tmplFields[i].type === 'multiselect');
      var el = $('ft-opts-' + i);
      if (el) el.style.display = isOpt ? 'block' : 'none';
      if (!isOpt) tmplFields[i].options = [];
    }
    function collectTemplate(){
      return tmplFields.map(function(f){
        var nf = { id: f.id || (root.RT_DB && root.RT_DB.genId ? root.RT_DB.genId() : ('f_' + Date.now() + Math.random())),
          label: (f.label || '').trim(), type: f.type || 'text', required: !!f.required };
        if (f.type === 'select' || f.type === 'multiselect') nf.options = (f.options || []).slice();
        if (f.placeholder) nf.placeholder = f.placeholder;
        return nf;
      });
    }

    // ---------- 表单 ----------
    function setErr(field, msg){
      var el = $('err-' + field);
      if (el){ el.textContent = msg || ''; el.classList.toggle('show', !!msg); }
      var input = $('f-' + field);
      if (input) input.classList.toggle('invalid', !!msg);
    }
    function clearErr(field){ setErr(field, ''); }

    function populateWorkflows(){
      return (typeof RT_WORKFLOWS !== 'undefined' ? RT_WORKFLOWS.getAllWorkflows() : Promise.resolve([])).then(function(list){
        var sel = $('f-workflow');
        var cur = sel.value;
        sel.innerHTML = '<option value="">' + t('common.select') + '</option>';
        (list || []).forEach(function(w){
          var o = document.createElement('option');
          o.value = w.id;
          o.textContent = w.name + (w.code ? '（' + w.code + '）' : '');
          sel.appendChild(o);
        });
        if (cur) sel.value = cur;
      });
    }
    function populateIcons(){
      var sel = $('f-icon');
      var cur = sel.value || 'process';
      sel.innerHTML = '';
      var keys = (typeof RT_PAGE_ICONS !== 'undefined' && RT_PAGE_ICONS.list) ? RT_PAGE_ICONS.list().map(function(x){ return x.key; }) : ['process'];
      if (keys.indexOf('process') < 0) keys.unshift('process');
      keys.forEach(function(k){
        var o = document.createElement('option');
        o.value = k; o.textContent = k;
        sel.appendChild(o);
      });
      sel.value = cur;
    }

    function resetForm(){
      $('f-code').value = ''; $('f-name').value = ''; $('f-desc').value = '';
      $('f-sort').value = '0';
      $('f-enabled').checked = true;
      updateCounter('f-name','maxName',50);
      updateCounter('f-desc','maxDesc',200);
      ['name','description','workflowId'].forEach(clearErr);
      tmplFields = []; renderTemplate();
      $('metaBox').style.display = 'none';
    }
    function openAdd(){
      if (typeof RT_PROCESSES === 'undefined') { showErr(t('common.moduleNotLoaded')); return; }
      editingId = null; resetForm();
      populateWorkflows(); populateIcons();
      $('sheetTitle').textContent = t('process.addSheet'); $('saveBtn').textContent = t('common.create');
      // 编码系统自动生成（只读）
      if (RT_PROCESSES.genNextCode) {
        RT_PROCESSES.genNextCode().then(function(code){ $('f-code').value = code; }).catch(function(){ $('f-code').value = ''; });
      }
      openSheet();
    }
    function openEdit(id){
      RT_PROCESSES.getProcess(id).then(function(r){
        if (!r) { toast(t('common.recordNotFound')); return; }
        editingId = id; resetForm();
        $('f-code').value = r.code || '';
        $('f-name').value = r.name || '';
        $('f-desc').value = r.description || '';
        $('f-sort').value = (r.sort == null ? 0 : r.sort);
        $('f-enabled').checked = (r.enabled !== false);
        updateCounter('f-name','maxName',50);
        updateCounter('f-desc','maxDesc',200);
        $('metaBox').style.display = 'block';
        $('metaBox').innerHTML = t('common.createdBy') + '：<b>' + escapeHtml(r.createdBy || '—') + '</b>　' + t('common.createdAt') + '：<b>' + fmtTime(r.createdAt) + '</b>';
        populateWorkflows().then(function(){ $('f-workflow').value = r.workflowId || ''; });
        populateIcons().then(function(){ $('f-icon').value = r.iconKey || 'process'; });
        tmplFields = (r.formTemplate || []).map(function(f){ return { id: f.id || '', label: f.label || '', type: f.type || 'text', options: (f.options || []).slice(), required: !!f.required, placeholder: f.placeholder || '' }; });
        renderTemplate();
        $('sheetTitle').textContent = t('process.editSheet'); $('saveBtn').textContent = t('common.save');
        openSheet();
      }).catch(function(){ toast(t('common.readFailed')); });
    }
    function save(){
      crudSave({
        store: 'RT_PROCESSES',
        create: 'createProcess',
        update: 'updateProcess',
        validate: 'validateProcess',
        getData: function(){
          return {
            code: $('f-code').value,
            name: $('f-name').value,
            description: $('f-desc').value,
            workflowId: $('f-workflow').value,
            formTemplate: collectTemplate(),
            iconKey: $('f-icon').value || 'process',
            sort: parseInt($('f-sort').value || '0', 10) || 0,
            enabled: $('f-enabled').checked
          };
        },
        fieldMap: { name: 'f-name', description: 'f-desc', workflowId: 'f-workflow' }
      });
    }

    // ---------- 删除 ----------
    var openConfirm = makeOpenConfirm({
      store: 'RT_PROCESSES',
      get: 'getProcess',
      text: function(r){ if (!r) return t('confirm.deleteUndo'); return t('confirm.deleteFormat').replace('$1', (r.name || '') + '（' + (r.code || '') + '）'); }
    });
    function doDelete(){
      crudDelete({ store: 'RT_PROCESSES', del: 'deleteProcess' });
    }

    onPageShow(render);
    onVisible(render);

    registerAppSW();
  </script>
</body>
</html>
