<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title data-i18n="workflow.title">工作流管理</title>
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
:root{
  --primary:#1677ff; --primary-light:#4096ff; --bg:#f5f7fa; --surface:#fff;
  --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --radius:14px; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,[onclick]{outline:none}
button:focus:not(:focus-visible),a:focus:not(:focus-visible),[onclick]:focus:not(:focus-visible),input:focus:not(:focus-visible),select:focus:not(:focus-visible),textarea:focus:not(:focus-visible){outline:none}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh; padding:0; -webkit-font-smoothing:antialiased;
}

/* 顶部导航 */
.nav-bar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;height:52px;padding:0 8px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding-top:calc(env(safe-area-inset-top) + 8px);
}
.nav-back{width:40px;height:40px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.nav-back svg{width:22px;height:22px}
.nav-title{font-size:17px;font-weight:700;text-align:center;position:absolute;left:0;right:0;pointer-events:none}
.nav-action{margin-left:auto;font-size:15px;font-weight:600;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(135deg,#1677ff,#4096ff);border-radius:10px;padding:8px 14px;
  box-shadow:0 4px 12px rgba(22,119,255,.3);-webkit-tap-highlight-color:transparent}
.nav-action:active{transform:translateY(1px)}

.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 90px)}

/* 搜索框 */
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;padding:0 12px;height:44px;margin-bottom:14px}
.search-box .ic{color:var(--muted);flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;background:none;font-size:15px;height:100%;color:var(--text)}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,#f5f9ff,#eef4ff)}
.card-head .gcode{font-size:12px;color:var(--primary);background:#eff6ff;padding:2px 8px;border-radius:999px;font-weight:600}
.card-head .gname{font-size:15px;font-weight:700;word-break:break-all}
.card-body{padding:12px 16px}
.card-desc{font-size:13px;color:var(--text);line-height:1.6;margin-bottom:10px;word-break:break-all}
.stat-row{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.meta-line{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.acts{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:active{background:#f2f4f7}
.icon-btn.danger{color:var(--danger);border-color:#fecaca}
.icon-btn.danger:active{background:#fef2f2}
.icon-btn svg{width:17px;height:17px}

/* 节点预览（列表卡片内） */
.node-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.node-pill{font-size:11px;background:#f1f5f9;border-radius:8px;padding:3px 8px;display:flex;align-items:center;gap:4px;max-width:100%}
.node-pill .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.node-pill .np-name{font-weight:600;color:var(--text)}
.node-pill .np-approver{color:var(--muted)}

/* 空状态 */
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.7}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}

/* 底部抽屉表单 */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
.sheet-mask.show{display:block}
.sheet{position:fixed;inset:0;left:0;right:0;top:0;bottom:0;z-index:101;background:var(--surface);max-width:none;width:100%;height:100dvh;border-radius:0;transform:none;transition:none;display:none;flex-direction:column;padding:0;overflow:hidden}
.sheet-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 14px}
.sheet.show{display:flex}
.sheet-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field label .max{float:right;color:#c7ccd4;font-weight:400}
.field input, .field select, .field textarea{width:100%;padding:0 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:15px;background:#fafbfc;outline:none;color:var(--text);transition:.2s;font-family:inherit}
.field input, .field select{height:48px}
.field textarea{min-height:84px;padding:12px 14px;resize:vertical;line-height:1.6}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(22,119,255,.12)}
.field input.invalid, .field select.invalid, .field textarea.invalid{border-color:var(--danger);background:#fff5f5}
.field input[readonly]{background:#f1f5f9;color:var(--muted);cursor:default}
.field .err{display:none;color:var(--danger);font-size:12px;margin-top:5px}
.field .err.show{display:block}
.readonly-meta{background:#f8fafc;border:1px dashed var(--border);border-radius:12px;padding:12px 14px;
  font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:14px}
.readonly-meta b{color:var(--text);font-weight:600}
.sheet-actions{display:flex;gap:12px;position:sticky;bottom:0;z-index:2;background:var(--surface);padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--border);margin-top:0}
.btn{flex:1;height:50px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;border:none}
.btn-ghost{flex:0 0 38%;border:1.5px solid var(--border);background:#fff;color:var(--text)}
.btn-primary{background:linear-gradient(135deg,#1677ff,#4096ff);color:#fff;box-shadow:0 8px 18px rgba(22,119,255,.32)}
.btn-primary:active{transform:translateY(1px)}

/* 节点卡片编辑 */
.node-list{margin-top:6px}
.node-card{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.node-card .node-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.node-card .node-name{flex:1;margin-bottom:0}
.node-card .node-name input{height:42px}
.node-del{width:32px;height:32px;flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center}
.node-del:active{background:#fef2f2}
.node-row{display:flex;gap:8px;margin-bottom:8px}
.node-row .field{flex:1;margin-bottom:0}
.node-row label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.node-row select{height:40px;padding:0 10px;font-size:14px}
.op-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.op-chip{display:flex;align-items:center;gap:5px;font-size:12px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer;user-select:none}
.op-chip input{width:15px;height:15px;accent-color:var(--primary)}
.op-chip.on{border-color:var(--primary);background:#eff6ff;color:var(--primary)}
.add-node-btn{width:100%;height:44px;border:1.5px dashed var(--border);background:#fff;border-radius:12px;color:var(--primary);font-weight:600;cursor:pointer;margin-top:2px}
.add-node-btn:active{background:#f0f6ff}

/* 删除确认浮层 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.show{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:22px 20px 18px;width:100%;max-width:320px;text-align:center}
.modal h3{font-size:17px;font-weight:700;margin-bottom:8px}
.modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:18px;word-break:break-all}
.modal .modal-actions{display:flex;gap:12px}
.modal .btn{flex:1;height:46px;font-size:15px}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:active{transform:translateY(1px)}

/* toast */
</style>

<body>

  <div class="nav-bar">
    <button class="nav-back" onclick="goBack()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title" data-i18n="workflow.title">工作流管理</span>
    <button class="nav-action" data-perm="op_workflow_create" onclick="openAdd()">+ <span data-i18n="common.add">新增</span></button>
  </div>

  <div class="wrap">
    <div class="search-box">
      <span class="ic"><svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="10" cy="10" r="6" fill="#9ca3af" fill-opacity="0.15" stroke="#9ca3af" stroke-width="2.5"/><path d="M15 15 L20 20" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/></svg></span>
      <input id="search" type="search" data-i18n-ph="workflow.searchPlaceholder" placeholder="搜索工作流名称 / 编码 / ID" oninput="render()" />
    </div>
    <div id="list"></div>
  </div>

  <!-- 新增/编辑 抽屉 -->
  <div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
  <div class="nav-bar">
    <button class="nav-back" onclick="closeSheet()" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <span class="nav-title" id="sheetTitle" data-i18n="workflow.addSheet">新增工作流</span>
  </div>
  <div class="sheet-body">

    <div class="readonly-meta" id="metaBox" style="display:none"></div>
    <div class="field">
      <label data-i18n="workflow.code">工作流编码</label>
      <input id="f-code" type="text" readonly placeholder="自动生成（如 PWAGZL001）">
    </div>
    <div class="field">
      <label data-i18n="workflow.name">工作流名称</label> <span class="max" id="maxName">0/50</span>
      <input id="f-name" type="text" maxlength="50" data-i18n-ph="workflow.namePlaceholder" placeholder="如：需求评审流程" oninput="updateCounter('f-name','maxName',50);clearErr('name')">
      <div class="err" id="err-name"></div>
    </div>
    <div class="field">
      <label data-i18n="workflow.description">描述</label> <span class="max" id="maxDesc">0/200</span>
      <textarea id="f-desc" maxlength="200" data-i18n-ph="workflow.descriptionPlaceholder" placeholder="如：需求从提交到上线的审批流转" oninput="updateCounter('f-desc','maxDesc',200);clearErr('description')"></textarea>
      <div class="err" id="err-description"></div>
    </div>
    <div class="field">
      <label data-i18n="workflow.nodes">流程节点（可增删，设状态 / 审批人 / 可用操作）</label>
      <div class="node-list" id="nodeList"></div>
      <button type="button" class="add-node-btn" onclick="addNode()">+ <span data-i18n="workflow.addNode">添加节点</span></button>
    </div>
    </div>
  <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeSheet()" data-i18n="common.cancel">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="save()" data-i18n="common.save">保存</button>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="modal-mask" id="confirmMask">
    <div class="modal">
      <h3 data-i18n="confirm.deleteTitle">删除确认</h3>
      <p id="confirmText" data-i18n="confirm.deleteUndo">确定删除该工作流记录？此操作不可撤销。</p>
      <div class="modal-actions">

      </div>

  <div class="toast" id="toast"></div>

  <script>
    var root = window;
    var editingId = null;
    var deletingId = null;
    var nodeSeq = 0;                 // 节点卡片本地临时 id 计数器
    var NODE_STATUS_OPTIONS = [];    // [{code,name,color}] 来自 WF_NODE_STATUS 字典
    var APPROVER_OPTIONS = [];       // [{account,name,nickname}] 来自用户目录
    var optsReady = false;

    // 节点操作枚举（与 workflows.js NODE_OPS 对齐）
    var NODE_OPS = ['SUBMIT', 'WITHDRAW', 'APPROVE', 'REJECT', 'TRANSFER', 'ADDSIGN'];
    // 操作集 i18n key 映射（字面量，便于静态悬空 key 检查）
    var OP_LABEL_KEYS = {
      SUBMIT: 'workflow.op.submit', WITHDRAW: 'workflow.op.withdraw', APPROVE: 'workflow.op.approve',
      REJECT: 'workflow.op.reject', TRANSFER: 'workflow.op.transfer', ADDSIGN: 'workflow.op.addsign'
    };
    function opLabel(code) { return t(OP_LABEL_KEYS[code] || code); }

    function userLabel(u) { return (u && (u.name || u.nickname || u.account)) || t('workflow.approverNone'); }

    // 预取下拉选项（节点状态字典 + 用户目录），仅加载一次
    function ensureOptions() {
      if (optsReady) return Promise.resolve();
      var p1 = (root.RT_DICT && RT_DICT.getDictByType)
        ? RT_DICT.getDictByType(RT_DICT.SEED_TYPE.WF_NODE_STATUS) : Promise.resolve([]);
      var p2 = (root.RT_USERS && RT_USERS.getAllUsers)
        ? RT_USERS.getAllUsers() : Promise.resolve([]);
      return Promise.all([p1, p2]).then(function (rs) {
        NODE_STATUS_OPTIONS = (rs[0] || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
        APPROVER_OPTIONS = (rs[1] || []).slice().sort(function (a, b) {
          return (userLabel(a) || '').localeCompare(userLabel(b) || '', 'zh');
        });
        optsReady = true;
      }).catch(function () { optsReady = true; });
    }

    // ---------- 列表渲染 ----------
    function render() {
      if (typeof RT_WORKFLOWS === 'undefined') { showErr(t('common.moduleNotLoaded')); return; }
      ensureOptions();
      var q = ($('search').value || '').trim().toLowerCase();
      RT_WORKFLOWS.getAllWorkflows().then(function (list) {
        if (q) {
          list = list.filter(function (r) {
            return (r.name + '').toLowerCase().indexOf(q) >= 0
              || (r.code + '').toLowerCase().indexOf(q) >= 0
              || (r.id + '').toLowerCase().indexOf(q) >= 0;
          });
        }
        var box = $('list');
        if (!list.length) {
          box.innerHTML = '<div class="empty">' + getEmptyIconHtml()
            + '<div>' + (q ? t('common.noMatch') : t('workflow.emptyHint')) + '</div></div>';
          applyGuard();
          return;
        }
        var html = '';
        list.forEach(function (r) {
          var sub = t('common.created') + '：' + escapeHtml(r.createdBy || '—') + ' · ' + fmtTime(r.createdAt)
            + (r.updatedBy ? '<br>' + t('common.updated') + '：' + escapeHtml(r.updatedBy) + ' · ' + fmtTime(r.updatedAt) : '');
          var pills = (r.nodes || []).map(function (n) {
            var st = statusOf(n.status);
            var ap = n.approver ? escapeHtml(userLabelByAccount(n.approver)) : '<span style="color:var(--muted)">' + t('workflow.approverNone') + '</span>';
            return '<span class="node-pill"><span class="status-dot" style="background:' + st.color + '"></span>'
              + '<span class="np-name">' + escapeHtml(n.name || '') + '</span>'
              + '<span class="np-approver">· ' + ap + '</span></span>';
          }).join('');
          html += '<div class="card">'
            + '<div class="card-head">'
            + '<span class="gcode">' + escapeHtml(r.code) + '</span>'
            + '<span class="gname">' + escapeHtml(r.name) + '</span>'
            + '</div>'
            + '<div class="card-body">'
            + (r.description ? '<div class="card-desc">' + escapeHtml(r.description) + '</div>' : '')
            + '<div class="stat-row"><span>' + t('workflow.nodeCount').replace('$1', (r.nodes ? r.nodes.length : 0)) + '</span></div>'
            + (pills ? '<div class="node-preview">' + pills + '</div>' : '')
            + '<div class="meta-line">' + sub + '</div>'
            + '</div>'
            + '<div style="display:flex;padding:0 16px 14px;justify-content:flex-end">'
            + '<div class="acts">'
            + '<button class="icon-btn" data-perm="op_workflow_edit" aria-label="编辑" onclick="openEdit(\'' + r.id + '\')">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
            + '<button class="icon-btn danger" data-perm="op_workflow_delete" aria-label="删除" onclick="openConfirm(\'' + r.id + '\')">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>'
            + '</div></div>'
            + '</div>';
        });
        box.innerHTML = html;
        applyGuard();
      }).catch(function (err) { showErr(t('common.loadFailed') + (err && err.message ? err.message : err)); });
    }

    // 节点状态 code -> {name,color}
    function statusOf(code) {
      for (var i = 0; i < NODE_STATUS_OPTIONS.length; i++) {
        if (NODE_STATUS_OPTIONS[i].code === code) return { name: NODE_STATUS_OPTIONS[i].name, color: NODE_STATUS_OPTIONS[i].color };
      }
      return { name: code || '', color: '#8c8c8c' };
    }
    function userLabelByAccount(account) {
      for (var i = 0; i < APPROVER_OPTIONS.length; i++) {
        if (APPROVER_OPTIONS[i].account === account) return userLabel(APPROVER_OPTIONS[i]);
      }
      return account || '';
    }

    // ---------- 表单 ----------
    function setErr(field, msg) {
      var el = $('err-' + field);
      if (el) { el.textContent = msg || ''; el.classList.toggle('show', !!msg); }
      var input = $('f-' + field);
      if (input) input.classList.toggle('invalid', !!msg);
    }
    function clearErr(field) { setErr(field, ''); }

    function resetForm() {
      $('f-code').value = '';
      $('f-name').value = '';
      $('f-desc').value = '';
      updateCounter('f-name', 'maxName', 50);
      updateCounter('f-desc', 'maxDesc', 200);
      ['name', 'description'].forEach(clearErr);
      $('metaBox').style.display = 'none';
      nodeSeq = 0;
      $('nodeList').innerHTML = '';
    }

    // 渲染单个节点卡片到 #nodeList
    function renderNodeCard(node) {
      node = node || {};
      var id = node.id || ('tmp' + (++nodeSeq));
      var name = node.name || '';
      var status = node.status || (NODE_STATUS_OPTIONS[0] ? NODE_STATUS_OPTIONS[0].code : '');
      var approver = node.approver || '';
      var ops = Array.isArray(node.ops) ? node.ops : [];

      var statusOpts = NODE_STATUS_OPTIONS.map(function (s) {
        return '<option value="' + s.code + '"' + (s.code === status ? ' selected' : '') + '>' + escapeHtml(s.name) + '</option>';
      }).join('');
      var approverOpts = '<option value="">' + t('workflow.approverNone') + '</option>'
        + APPROVER_OPTIONS.map(function (u) {
            return '<option value="' + escapeHtml(u.account) + '"' + (u.account === approver ? ' selected' : '') + '>' + escapeHtml(userLabel(u)) + '</option>';
          }).join('');
      var opChips = NODE_OPS.map(function (code) {
        var on = ops.indexOf(code) >= 0;
        return '<label class="op-chip' + (on ? ' on' : '') + '"><input type="checkbox" class="node-op" value="' + code + '"' + (on ? ' checked' : '') + '>' + escapeHtml(opLabel(code)) + '</label>';
      }).join('');

      var card = document.createElement('div');
      card.className = 'node-card';
      card.dataset.id = id;
      card.innerHTML =
        '<div class="node-head">'
        + '<div class="field node-name"><input class="nn-input" type="text" maxlength="30" placeholder="' + t('workflow.nodeName') + '" value="' + escapeHtml(name) + '"></div>'
        + '<button type="button" class="node-del" aria-label="删除节点" onclick="removeNode(this)">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>'
        + '</div>'
        + '<div class="node-row">'
        + '<div class="field"><label>' + t('workflow.nodeStatus') + '</label><select class="ns-input">' + statusOpts + '</select></div>'
        + '<div class="field"><label>' + t('workflow.approver') + '</label><select class="na-input">' + approverOpts + '</select></div>'
        + '</div>'
        + '<div class="field"><label>' + t('workflow.ops') + '</label><div class="op-row">' + opChips + '</div></div>';
      $('nodeList').appendChild(card);
    }

    function addNode() { renderNodeCard({}); }
    function removeNode(btn) {
      var card = btn.closest('.node-card');
      if (card) card.parentNode.removeChild(card);
    }

    // 从 #nodeList 收集结构化节点
    function collectNodes() {
      var nodes = [];
      var cards = document.querySelectorAll('#nodeList .node-card');
      cards.forEach(function (card) {
        nodes.push({
          id: card.dataset.id && card.dataset.id.indexOf('tmp') !== 0 ? card.dataset.id : '',
          name: (card.querySelector('.nn-input').value || '').trim(),
          status: card.querySelector('.ns-input').value || '',
          approver: card.querySelector('.na-input').value || '',
          ops: Array.prototype.slice.call(card.querySelectorAll('.node-op:checked')).map(function (c) { return c.value; })
        });
      });
      return nodes;
    }

    function openAdd() {
      ensureOptions().then(function () {
        editingId = null; resetForm();
        // 预览自动编号
        if (root.RT_WORKFLOWS && RT_WORKFLOWS.genNextCode) {
          RT_WORKFLOWS.genNextCode().then(function (code) { $('f-code').value = code; }).catch(function () { $('f-code').value = ''; });
        }
        $('sheetTitle').textContent = t('workflow.addSheet');
        $('saveBtn').textContent = t('common.create');
        openSheet();
      });
    }
    function openEdit(id) {
      ensureOptions().then(function () {
        RT_WORKFLOWS.getWorkflow(id).then(function (r) {
          if (!r) { toast(t('common.recordNotFound')); return; }
          editingId = id; resetForm();
          $('f-code').value = r.code || '';
          $('f-name').value = r.name || '';
          $('f-desc').value = r.description || '';
          updateCounter('f-name', 'maxName', 50);
          updateCounter('f-desc', 'maxDesc', 200);
          (r.nodes || []).forEach(function (n) { renderNodeCard(n); });
          $('metaBox').style.display = 'block';
          $('metaBox').innerHTML = t('common.createdBy') + '：<b>' + escapeHtml(r.createdBy || '—') + '</b>　' + t('common.createdAt') + '：<b>' + fmtTime(r.createdAt) + '</b>';
          $('sheetTitle').textContent = t('workflow.editSheet');
          $('saveBtn').textContent = t('common.save');
          openSheet();
        }).catch(function () { toast(t('common.readFailed')); });
      });
    }
    function save() {
      crudSave({
        store: 'RT_WORKFLOWS',
        create: 'createWorkflow',
        update: 'updateWorkflow',
        validate: 'validateWorkflow',
        getData: function () {
          return {
            name: $('f-name').value,
            description: $('f-desc').value,
            nodes: collectNodes()
          };
        },
        fieldMap: { name: 'f-name', description: 'f-desc' }
      });
    }

    // ---------- 删除 ----------
    var openConfirm = makeOpenConfirm({
      store: 'RT_WORKFLOWS',
      get: 'getWorkflow',
      text: function (r) { if (!r) return t('confirm.deleteUndo'); return t('confirm.deleteFormat').replace('$1', (r.name || '') + '（' + (r.code || '') + '）'); }
    });
    function doDelete() {
      crudDelete({ store: 'RT_WORKFLOWS', del: 'deleteWorkflow' });
    }

    onPageShow(render);
    onVisible(render);

    registerAppSW();
  </script>
</body>
</html>
